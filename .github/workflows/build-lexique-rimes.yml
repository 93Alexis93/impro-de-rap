name: Build Lexique rhyme database

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/build_lexique_rimes.py"
      - ".github/workflows/build-lexique-rimes.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build compact rhyme index from official Lexique data
        run: python3 scripts/build_lexique_rimes.py
      - name: Validate generated index
        run: |
          python3 - <<'PY'
          import json, os
          path = "data/lexique-rimes.json"
          with open(path, encoding="utf-8") as f:
              data = json.load(f)
          assert data.get("source") == "Lexique 4.00 officiel", "Source/version absente"
          assert data.get("license") == "CC BY-SA 4.0", "Licence absente"
          assert data.get("generated_rows", 0) >= 100000, "Index anormalement petit"
          assert len(data.get("families", {})) >= 1000, "Trop peu de finales"
          assert len(data.get("word_index", {})) >= 100000, "Index de mots incomplet"
          assert all(isinstance(k, str) and isinstance(v, list) for k, v in data["families"].items())
          assert all(len(entry) >= 3 and isinstance(entry[0], str) for values in data["families"].values() for entry in values)
          print(f"Validation OK : {data['generated_rows']} formes, {len(data['word_index'])} clés, {len(data['families'])} finales, {os.path.getsize(path)} octets")
          PY
      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lexique-rimes.json
          if git diff --cached --quiet; then
            echo "No changes in the generated index."
          else
            git commit -m "Build Lexique phonetic rhyme index"
            git pull --rebase origin main
            git push
          fi
